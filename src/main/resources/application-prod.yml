spring:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
  cache:
    type: simple
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: true
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8080}
management:
  health:
    # spring-boot-starter-data-redis está en el classpath (usado en qa/dev),
    # así que su health indicator se auto-configura igual aunque este perfil
    # use cache.type=simple y no tenga Redis corriendo — sin esto, /actuator/health
    # queda en DOWN aunque la app funcione bien.
    redis:
      enabled: false
    # El email de notificación del Libro de Reclamaciones es best-effort (si
    # falla, el reclamo igual se guarda — ver ComplaintNotificationService).
    # No tiene sentido que tumbe el health general si MAIL_* no está
    # configurado todavía o el SMTP falla puntualmente.
    mail:
      enabled: false