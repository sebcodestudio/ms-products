# application.yml
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8080}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}

app:
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  complaints:
    notification-email: ${COMPLAINT_NOTIFICATION_EMAIL:${MAIL_USERNAME:}}
  storage:
    # Mismas variables que ya pasa docker-compose.yml al servicio ms-products:
    # en dev apuntan al MinIO local, en prod (Render) deben apuntar a Cloudflare
    # R2 (endpoint S3 de la cuenta, no el dominio público pub-*.r2.dev).
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:product-images}
    region: ${MINIO_REGION:auto}
    # Dominio público desde el que se sirven las imágenes ya subidas (distinto
    # del endpoint de la API S3). En R2 es el dominio pub-*.r2.dev del bucket.
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:9000/${MINIO_BUCKET:product-images}}
  payment:
    # culqi (default) = cobro real vía Culqi. mock = simula el cobro sin
    # llamar a ninguna pasarela (ver MockPaymentProvider) — útil para probar
    # el flujo end-to-end antes de tener llaves de prueba de Culqi.
    provider: ${PAYMENT_PROVIDER:culqi}
    culqi:
      # Llave secreta, server-side, para efectivamente cobrar. La pública la
      # usa el frontend directo (NEXT_PUBLIC_CULQI_PUBLIC_KEY), el backend no
      # la necesita. Vacía por defecto — hay que cargar la de prueba (sandbox)
      # de Culqi antes de poder probar un cobro real.
      secret-key: ${CULQI_SECRET_KEY:}
  invoicing:
    # external (default) = llama a la API real del sistema de facturación.
    # mock = simula la emisión de boleta/factura sin llamar a nada (ver
    # MockElectronicInvoiceProvider) — útil para probar el flujo antes de
    # tener el contrato real de esa API.
    mode: ${INVOICING_MODE:external}
    # Sistema de facturación electrónica propio ("facturacion-app", Quarkus,
    # aún no en prod). Vacío por defecto: mientras no esté configurado, el
    # envío se omite sin afectar el pago (ver ExternalElectronicInvoiceProvider).
    # api-url es la base (sin /api/comprobantes/...), ej. http://localhost:8081.
    api-url: ${INVOICING_API_URL:}
    api-key: ${INVOICING_API_KEY:}
    serie-boleta: ${SERIE_BOLETA:B001}
    serie-factura: ${SERIE_FACTURA:F001}
    emisor:
      # Datos fijos de la empresa que emite el comprobante — van en cada
      # boleta/factura, no dependen del pedido.
      ruc: ${EMISOR_RUC:}
      razon-social: ${EMISOR_RAZON_SOCIAL:}
      nombre-comercial: ${EMISOR_NOMBRE_COMERCIAL:}
      ubigeo: ${EMISOR_UBIGEO:}
      direccion: ${EMISOR_DIRECCION:}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: ms-products
    description: Product management microservice
    version: 0.0.1-SNAPSHOT