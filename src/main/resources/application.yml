# application.yml
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8080}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}

app:
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  complaints:
    notification-email: ${COMPLAINT_NOTIFICATION_EMAIL:${MAIL_USERNAME:}}
  storage:
    # Mismas variables que ya pasa docker-compose.yml al servicio ms-products:
    # en dev apuntan al MinIO local, en prod (Render) deben apuntar a Cloudflare
    # R2 (endpoint S3 de la cuenta, no el dominio público pub-*.r2.dev).
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:product-images}
    region: ${MINIO_REGION:auto}
    # Dominio público desde el que se sirven las imágenes ya subidas (distinto
    # del endpoint de la API S3). En R2 es el dominio pub-*.r2.dev del bucket.
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:9000/${MINIO_BUCKET:product-images}}
  payment:
    culqi:
      # Llave secreta, server-side, para efectivamente cobrar. La pública la
      # usa el frontend directo (NEXT_PUBLIC_CULQI_PUBLIC_KEY), el backend no
      # la necesita. Vacía por defecto — hay que cargar la de prueba (sandbox)
      # de Culqi antes de poder probar un cobro real.
      secret-key: ${CULQI_SECRET_KEY:}
  invoicing:
    # Sistema de facturación electrónica propio (en desarrollo, aún no en
    # prod). Vacío por defecto: mientras no esté configurado, el envío se
    # omite sin afectar el pago (ver ExternalElectronicInvoiceProvider).
    api-url: ${INVOICING_API_URL:}
    api-key: ${INVOICING_API_KEY:}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: ms-products
    description: Product management microservice
    version: 0.0.1-SNAPSHOT