# application-dev.yml
spring:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        boot.allow_jdbc_metadata_access: true
        jdbc.lob.non_contextual_creation: true
        temp.use_jdbc_metadata_defaults: false
        javax.persistence.schema-generation.database.action: none
        initializer_order: 1
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
      separator: "$$"
  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false

    data:
      redis:
        host: localhost
        port: 6379
        password: ${REDIS_PASSWORD:}
        timeout: 2000ms
        lettuce:
          pool:
            max-active: 8
            max-idle: 8
            min-idle: 2

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
    baseline-on-migrate: true
    validate-on-migrate: true
    check-location: true
    out-of-order: true
  main:
    allow-circular-references: true
  logging:
    level:
      org.flywaydb: DEBUG
      org.springframework.boot.autoconfigure.flyway: DEBUG

app:
  payment:
    # En local, simulado por defecto — no hace falta llave de Culqi para
    # probar el flujo. Forzar PAYMENT_PROVIDER=culqi para probar contra el
    # sandbox real una vez que haya llaves.
    provider: ${PAYMENT_PROVIDER:mock}
  invoicing:
    # Igual: simulado por defecto en local, hasta tener el contrato real de
    # la API de facturación.
    mode: ${INVOICING_MODE:mock}